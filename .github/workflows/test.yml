name: Tutor state tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FSRS
        run: python -m pip install 'fsrs>=6,<7'
      - name: Test
        run: python -m unittest discover -s socratic-tutor/tests -v
